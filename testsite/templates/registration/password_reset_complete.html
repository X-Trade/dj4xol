{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>Password Updated</title>
        <link rel="stylesheet" href="{% static 'dj4xol/css/theme.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/home/css/home.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/css/forms.css' %}">
    </head>
    <body class="classic onboarding single-panel-page">
        <div class="title-bar">
            <span class="title">DJ4XOL</span>
            <span class="tagline">Password Updated</span>
        </div>
        <div class="columns single-column">
            <div class="column">
                <div class="panel no-transition open" data-panel="password-reset-complete">
                    <h2><span>Password Updated</span><span class="panel-toggle"></span></h2>
                    <div class="panel-content panel-stack">
                        <section class="panel-scrollable-text">
                            <p>Your password has been updated. You can now sign in with the new password.</p>
                            <div class="form-nav">
                                <button type="button" class="nav-button primary" onclick="window.location.href='{% url 'login' %}'">Log In &raquo;</button>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        {% include 'dj4xol/_site_footer.html' %}
    </body>
</html>
