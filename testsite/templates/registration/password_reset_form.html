{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>Forgot Password</title>
        <link rel="stylesheet" href="{% static 'dj4xol/css/theme.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/home/css/home.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/css/forms.css' %}">
    </head>
    <body class="classic onboarding single-panel-page">
        <div class="title-bar">
            <span class="title">DJ4XOL</span>
            <span class="tagline">Forgot Password</span>
        </div>
        <div class="columns single-column">
            <div class="column">
                <div class="panel no-transition open" data-panel="password-reset">
                    <h2><span>Reset Password</span><span class="panel-toggle"></span></h2>
                    <div class="panel-content panel-stack">
                        <section class="panel-scrollable-text">
                            <p>Enter your account email address and we will send you a password reset link.</p>
                            <form method="post">
                                {% csrf_token %}
                                <table class="profile-table">
                                    <tr>
                                        <th>{{ form.email.label_tag }}</th>
                                        <td>{{ form.email }}{{ form.email.errors }}</td>
                                    </tr>
                                </table>
                                <div class="form-nav">
                                    <button type="button" class="nav-button" onclick="window.location.href='{% url 'login' %}'">&laquo; Back</button>
                                    <button type="submit" class="nav-button primary">Send Reset Link &raquo;</button>
                                </div>
                            </form>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        {% include 'dj4xol/_site_footer.html' %}
    </body>
</html>
