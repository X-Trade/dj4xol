<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Asteroid Field Preview</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 24px;
        border-radius: 12px;
        text-align: center;
      }
      .title {
        font-size: 14px;
        letter-spacing: 0.04em;
        margin-bottom: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .preview {
        width: 120px;
        height: 120px;
        background: #000;
        border: 1px dashed rgba(255, 255, 255, 0.25);
        display: grid;
        place-items: center;
      }
      img {
        width: 48px;
        height: 48px;
        image-rendering: auto;
      }
      .note {
        margin-top: 12px;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="title">Asteroid Field SVG</div>
        <div class="preview">
          <img src="img/asteroid_field.svg" alt="Asteroid field preview">
        </div>
        <div class="note">Background is black to match starmap.</div>
      </div>
    </div>
  </body>
</html>
