{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Create Account</title>
    </head>
    <body>
        <h1>Create Account</h1>
        <p>Create a new account to start your 4x Profile.</p>
        <form method="post">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <p><button type="submit">Sign Up</button></p>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </body>
</html>
