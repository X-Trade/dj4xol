{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>Create 4x Profile</title>
        <link rel="stylesheet" href="{% static 'dj4xol/css/theme.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/home/css/home.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/css/forms.css' %}">
    </head>
    <body class="classic onboarding">
        <div class="title-bar">
            <span class="title">4x Profile</span>
            <span class="tagline">Step 1 of 3</span>
        </div>
        <div class="columns single-column">
            <div class="column">
                <div class="panel no-transition open" data-panel="profile">
                    <h2><span>Create Your 4x Profile</span><span class="panel-toggle"></span></h2>
                    <div class="panel-content"><div>
                        <form method="post">
                            {% csrf_token %}
                            <table class="profile-table">
                                {{ form.as_table }}
                            </table>
                            <p class="help-text">Social links are optional. You can edit your 4x Profile later.</p>
                            <div class="form-nav single-action">
                                <button type="submit" class="nav-button primary">Next &raquo;</button>
                            </div>
                        </form>
                    </div></div>
                </div>
            </div>
        </div>
        <script>
            (function() {
                var panels = document.querySelectorAll('.panel');
                panels.forEach(function(panel) {
                    var header = panel.querySelector('h2');
                    if (header) {
                        header.addEventListener('click', function() {
                            panel.classList.remove('no-transition');
                            panel.classList.toggle('open');
                        });
                    }
                });
            })();
        </script>
    </body>
</html>
