{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Create Game</title>
    </head>
    <body>
        <h1>Create New Game</h1>
        <form method="post">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <p><button type="submit">Create Game</button></p>
        </form>
        <p><a href="{% url 'dj4xol:index' %}">Back to Games</a></p>
        <p><a href="{% url 'dj4xol:create_race' %}">Create a new race first</a></p>
    </body>
</html>
