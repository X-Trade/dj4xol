<div class="messages-section">
    <h2>Messages</h2>
    <div id="messages">
        <div class="messages-scroll">
            {% for msg in messages %}
            <div class="message">
                <span class="message-year">Year {{ msg.year }}</span>
                <p class="message-text">{{ msg.message }}</p>
            </div>
            {% empty %}
            <p class="no-messages">No messages yet.</p>
            {% endfor %}
        </div>
        <div class="messages-footer">
            <a href="{% url 'dj4xol:message_history' game.short_id %}">View full history</a>
        </div>
    </div>
</div>
