<div class="messages-section panel no-transition open" data-panel="messages">
    <h2><span>Messages</span><span class="panel-toggle"></span></h2>
    <div class="panel-content"><div id="messages" data-year="{{ game.year }}">
        <div class="messages-scroll" id="messages-scroll">
            {% for msg in messages %}
            <div class="message{% if msg.priority %} priority{% endif %}">
                <span class="message-year">Year {{ msg.year }}{% if msg.priority %} <span class="priority-flag">!</span>{% endif %}</span>
                <p class="message-text">{{ msg.message|safe }}</p>
            </div>
            {% empty %}
            <p class="no-messages">No messages yet.</p>
            {% endfor %}
        </div>
        <div class="messages-footer">
            <a href="{% url 'dj4xol:message_history' game.short_id %}">View full history</a>
        </div>
    </div></div>
</div>
