<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ email_subject }}</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 8px;
            line-height: 1.4;
        }
        .email-wrap {
            max-width: 860px;
            margin: 0 auto;
        }
        .email-panel {
            border: 2px solid;
        }
        .email-content {
            padding: 14px;
        }
        .email-footer {
            padding: 10px 14px;
            border-top: 1px solid;
            font-size: 12px;
        }
        .email-kicker {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            opacity: 0.85;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 21px;
            line-height: 1.2;
        }
        h2 {
            margin: 12px 0 6px 0;
            font-size: 16px;
            line-height: 1.25;
        }
        p {
            margin: 0 0 10px 0;
        }
        ul {
            margin: 8px 0 10px 18px;
            padding: 0;
        }
        li {
            margin: 0 0 4px 0;
        }
        .email-entry {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid;
        }
        .email-entry:first-of-type {
            border-top: 0;
            margin-top: 0;
            padding-top: 0;
        }
        .pill {
            display: inline-block;
            padding: 1px 6px;
            border: 1px solid;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.3;
            vertical-align: middle;
            margin-right: 4px;
        }

        body.email-theme-classic {
            background: #e6e6e6;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
        }
        body.email-theme-classic .email-panel {
            background: #f8f8f8;
            border-color: #666;
        }
        body.email-theme-classic .email-footer,
        body.email-theme-classic .email-entry {
            border-color: #bbb;
        }
        body.email-theme-classic a {
            color: #1f5f9f;
        }

        body.email-theme-lcars {
            background: #050913;
            color: #f1f2ff;
            font-family: "Trebuchet MS", Verdana, Arial, sans-serif;
        }
        body.email-theme-lcars .email-panel {
            background: #111526;
            border-color: #df8556;
            box-shadow: inset 0 0 0 1px #9c9acf;
        }
        body.email-theme-lcars .email-footer,
        body.email-theme-lcars .email-entry {
            border-color: #5f628f;
        }
        body.email-theme-lcars a {
            color: #ffd18f;
        }
        body.email-theme-lcars .pill {
            color: #ffd18f;
            border-color: #df8556;
        }

        body.email-theme-win95 {
            background: #008080;
            color: #101010;
            font-family: Tahoma, Verdana, Arial, sans-serif;
        }
        body.email-theme-win95 .email-panel {
            background: #c0c0c0;
            border-color: #111;
            box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #7f7f7f;
        }
        body.email-theme-win95 .email-footer,
        body.email-theme-win95 .email-entry {
            border-color: #8a8a8a;
        }
        body.email-theme-win95 a {
            color: #0000b5;
        }
        body.email-theme-win95 .pill {
            color: #000;
            border-color: #222;
            background: #d8d8d8;
        }

        body.email-theme-haxxor {
            background: #05080b;
            color: #b6f7cb;
            font-family: "Courier New", Courier, monospace;
        }
        body.email-theme-haxxor .email-panel {
            background: #0a1216;
            border-color: #2de0a7;
            box-shadow: inset 0 0 0 1px #205b4f;
        }
        body.email-theme-haxxor .email-footer,
        body.email-theme-haxxor .email-entry {
            border-color: #205b4f;
        }
        body.email-theme-haxxor a {
            color: #7ee6ff;
        }
        body.email-theme-haxxor .pill {
            color: #b6f7cb;
            border-color: #2de0a7;
        }

        body.email-theme-retro {
            background: #081122;
            color: #d8e5ff;
            font-family: "Courier New", Courier, monospace;
        }
        body.email-theme-retro .email-panel {
            background: #0f203a;
            border-color: #4a77a8;
            box-shadow: inset 0 0 0 1px #2d4f78;
        }
        body.email-theme-retro .email-footer,
        body.email-theme-retro .email-entry {
            border-color: #2d4f78;
        }
        body.email-theme-retro a {
            color: #83dcff;
        }
        body.email-theme-retro .pill {
            color: #8ef9d1;
            border-color: #8ef9d1;
        }
    </style>
</head>
<body class="email-theme-{{ email_theme|default:'classic' }}">
    <div class="email-wrap">
        <div class="email-panel">
            <div class="email-content">
                <div class="email-kicker">DJ4XOL</div>
                <h1>{% block heading %}{{ email_subject }}{% endblock %}</h1>
                {% block body %}{% endblock %}
            </div>
            <div class="email-footer">
                {% block footer %}This is an automated DJ4XOL email.{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
