{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>4x Profile - Create Race</title>
        <link rel="stylesheet" href="{% static 'dj4xol/css/theme.css' %}">
        <link rel="stylesheet" href="{% static 'dj4xol/home/css/home.css' %}">
        {% if selected_theme == 'lcars' %}<link rel="stylesheet" href="{% static 'dj4xol/css/theme-lcars.css' %}">{% endif %}
        {% if selected_theme == 'win95' %}<link rel="stylesheet" href="{% static 'dj4xol/css/theme-win95.css' %}">{% endif %}
    </head>
    <body class="{% if selected_theme %}{{ selected_theme }}{% else %}classic{% endif %} onboarding">
        <div class="title-bar">
            <span class="title">4x Profile</span>
            <span class="tagline">Step 3 of 3</span>
        </div>
        <div class="columns single-column">
            <div class="column">
                <div class="panel no-transition open" data-panel="race">
                    <h2><span>Create Your First Race</span><span class="panel-toggle"></span></h2>
                    <div class="panel-content"><div>
                        <form method="post" class="race-form">
                            {% csrf_token %}
                            {% include 'dj4xol/_race_form_table.html' %}
                            <div class="form-nav">
                                <button type="button" class="nav-button" onclick="window.location.href='{% url 'dj4xol:onboarding_theme' %}'">&laquo; Prev</button>
                                <button type="submit" class="nav-button primary">Finish &raquo;</button>
                            </div>
                        </form>
                    </div></div>
                </div>
            </div>
        </div>
        <script>
            (function() {
                var panels = document.querySelectorAll('.panel');
                panels.forEach(function(panel) {
                    var header = panel.querySelector('h2');
                    if (header) {
                        header.addEventListener('click', function() {
                            panel.classList.remove('no-transition');
                            panel.classList.toggle('open');
                        });
                    }
                });

                var nameInput = document.getElementById('id_name');
                var pluralInput = document.getElementById('id_plural_name');
                if (nameInput && pluralInput) {
                    var autoPlural = function() {
                        if (!pluralInput.value || pluralInput.dataset.autofill === 'true') {
                            pluralInput.value = nameInput.value ? nameInput.value + 's' : '';
                            pluralInput.dataset.autofill = 'true';
                        }
                    };
                    nameInput.addEventListener('input', autoPlural);
                    pluralInput.addEventListener('input', function() {
                        pluralInput.dataset.autofill = 'false';
                    });
                    autoPlural();
                }
            })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/brython@3.13.1/brython_stdlib.js"></script>
        <script type="text/python" src="{% static 'dj4xol/brython/habitability_rules.py' %}"></script>
        <script type="text/python" src="{% static 'dj4xol/brython/race_builder.py' %}"></script>
        <script>
            window.addEventListener('load', function() {
                if (window.brython) {
                    brython();
                }
            });
        </script>
    </body>
</html>
