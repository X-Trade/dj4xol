{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <title>Join Game</title>
    </head>
    <body>
        <h1>Join {{ game.name }}</h1>
        <p>{{ game.description }}</p>
        <form method="post">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <p><button type="submit">Join Game</button></p>
        </form>
        <p><a href="{% url 'dj4xol:index' %}">Back to Games</a></p>
        <p><a href="{% url 'dj4xol:create_race' %}">Create a new race first</a></p>
    </body>
</html>
